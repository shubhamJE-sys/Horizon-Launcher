name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find the project folder
        id: proj
        run: |
          S=$(find . -maxdepth 3 -name settings.gradle -not -path './.git/*' | head -n 1)
          echo "settings file: $S"
          D=$(dirname "$S")
          echo "dir=$D" >> "$GITHUB_OUTPUT"
          echo "VERSION=$(grep -oP "versionName '\K[^']+" "$D/app/build.gradle")" >> "$GITHUB_ENV"
          echo "CODE=$(grep -oP "versionCode \K[0-9]+" "$D/app/build.gradle")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HorizonLauncher-v${{ env.VERSION }}-code${{ env.CODE }}
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
