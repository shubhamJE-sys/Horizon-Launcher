name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HorizonWallpaper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Read the version
        run: |
          echo "VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)" >> "$GITHUB_ENV"
          echo "CODE=$(grep -oP "versionCode \K[0-9]+" app/build.gradle)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: HorizonLauncher-v${{ env.VERSION }}-code${{ env.CODE }}
          path: HorizonWallpaper/app/build/outputs/apk/debug/*.apk
